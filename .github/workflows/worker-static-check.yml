name: Worker Static Check

on:
  push:
    branches:
      - development/payments-hardening-2026-11-11
    paths:
      - "workers/**"
      - ".github/workflows/worker-static-check.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker JavaScript syntax
        run: node --check workers/boca-delivery-pix.js
