async function ding(){
  try{if(!bell.ctx)bell.ctx=new (window.AudioContext||window.webkitAudioContext)();if(bell.ctx.state==='suspended')await bell.ctx.resume()}catch(e){return false}
  const c=bell.ctx;if(c.state!=='running')return false;
  [[880,0],[660,.3]].forEach(p=>{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+p[1];o.type='sine';o.frequency.value=p[0];o.connect(g);g.connect(c.destination);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.03,bellVol()),t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.55);o.start(t);o.stop(t+.6)});
  return true;
}
function bellStatus(msg){const el=$('#bs');if(!el)return;const c=bell.ctx;
  el.textContent=msg||(!bellOn()?'Som desligado: você NÃO será avisado de pedidos novos.':(!c||c.state!=='running')?'Clique em "Testar campainha" para liberar o som neste navegador.':'Campainha ativa'+(bell.pend?' · tocando até você aceitar o pedido.':'.'))}

function syncBell(n){
  const up=n>bell.last;bell.last=n;bell.pend=n;
  const pb=$('#pendbar');if(pb){pb.hidden=!n;pb.textContent=n+(n>1?' pedidos novos aguardando aceite':' pedido novo aguardando aceite')}
  if(!n){clearInterval(bell.ring);clearInterval(bell.flash);bell.ring=bell.flash=null;document.title=C.nome;bellStatus();return}
  if(!bell.flash){let on=false;bell.flash=setInterval(()=>{on=!on;document.title=on?'('+bell.pend+') NOVO PEDIDO!':C.nome},1000)}
  if(bellOn()){if(up)ding();if(!bell.ring)bell.ring=setInterval(()=>{if(bellOn())ding();bellStatus()},3000)}
  else if(bell.ring){clearInterval(bell.ring);bell.ring=null}
  bellStatus();
}

function comandaTxt(o,cols,via,vias){
  const out=[],rule='-'.repeat(cols),ESC='\x1b',GS='\x1d';
  const wrap=(t,ind)=>{t=semAc(t);const pad=' '.repeat(ind||0),max=cols-pad.length,r=[];let l='';
    t.split(' ').forEach(w=>{while(w.length>max){if(l){r.push(l);l=''}r.push(w.slice(0,max));w=w.slice(max)}if(l&&(l+' '+w).length>max){r.push(l);l=w}else l=l?l+' '+w:w});if(l)r.push(l);return r.map(x=>pad+x)};
  const two=(a,b)=>{a=semAc(a);b=semAc(b);if(a.length+b.length+1>cols)a=a.slice(0,Math.max(1,cols-b.length-1));return a+' '.repeat(cols-a.length-b.length)+b};
  const ctr=t=>{t=semAc(t).slice(0,cols);return ' '.repeat(Math.floor((cols-t.length)/2))+t};
  const big=t=>{t=semAc(t);const h=Math.floor(cols/2);t=t.slice(0,h);return GS+'!\x11'+' '.repeat(Math.floor((h-t.length)/2))+t+GS+'!\x00'};
  const bold=t=>ESC+'E\x01'+t+ESC+'E\x00',ret=o.tipo==='retirada';
  out.push(ESC+'@'+bold(ctr(C.nome)),ctr(new Date(o.criado).toLocaleString('pt-BR')),big('PEDIDO '+o.id));
  if(vias>1)out.push(ctr('VIA '+via+'/'+vias));
  out.push(rule,bold(ret?'RETIRADA NO BALCAO':'ENTREGA'));
  wrap(o.nome+' - '+o.tel).forEach(x=>out.push(x));
  if(!ret)wrap((o.cidade||o.bairro||'')+' - '+o.end).forEach(x=>out.push(x));
  out.push(rule);
  o.itens.forEach(l=>{out.push(two(l.qtd+'x '+l.nome,money(l.qtd*l.preco)));
    if(l.extras&&l.extras.length)wrap('+ '+l.extras.join(', '),2).forEach(x=>out.push(x));
    if(l.obs)wrap('obs: '+l.obs,2).forEach(x=>out.push(x))});
  out.push(rule,two('Subtotal',money(o.subtotal)));
  if(o.desconto)out.push(two('Desconto'+(o.cupom?' ('+o.cupom+')':''),'-'+money(o.desconto)));
  out.push(two(ret?'Retirada':'Entrega',money(o.taxa)),bold(two('TOTAL',money(o.total))),rule);

      <div>Atendimento da loja: <b style="color:#d99a00">${stars(x.atendimento)}</b> (${Number(x.atendimento)||0}/5)</div>
      ${x.comentario?`<p style="margin:8px 0 0"><b>Comentário:</b> ${E(x.comentario)}</p>`:'<p class="note" style="margin:8px 0 0">Sem comentário.</p>'}</div>`;
    }).join('')||'<p class="note">Ainda não há avaliações dos clientes.</p>';
  };
  unsubs.push(S.col('feedback',l=>{rows=l;draw()}));
  unsubs.push(S.col('orders',l=>{orders=l;draw()}));
}
// ----- Programa de fidelidade -----
function fidelidade(tc){
  const render=()=>{
    const f=C.fidelidade||{},ativo=f.ativo===true;
    const data=f.inicio?new Date(f.inicio).toLocaleString('pt-BR'):'Ainda não ativado';
    tc.innerHTML=`<section class="f">
      <h2 style="margin:0">Programa de fidelidade</h2>
      <p>O cliente poderá ganhar uma recompensa a cada 20 unidades compradas na categoria Lanches e, separadamente, a cada 20 unidades na categoria Refeições.</p>
      <p><b>Situação atual:</b> <span class="${ativo?'ok':'bad'}">${ativo?'Programa ativo':'Programa suspenso'}</span></p>
      <p><b>Início da contagem:</b> ${E(data)}</p>
      <p class="note">Ao suspender, a contagem e os resgates ficam pausados. O progresso e as recompensas já conquistadas serão preservados. Ao reativar, o programa continuará do mesmo ponto.</p>
      <button type="button" class="btn ${ativo?'alt':''}" id="loyaltyToggle">${ativo?'Suspender programa':'Ativar programa'}</button>
      <p id="loyaltyMsg" role="status" style="margin:8px 0 0"></p>
    </section>`;
    $('#loyaltyToggle').onclick=async()=>{
      const btn=$('#loyaltyToggle'),msg=$('#loyaltyMsg');
      btn.disabled=true;msg.textContent='Salvando...';
      const atual=C.fidelidade||{},novoAtivo=atual.ativo!==true;
      const agora=new Date().toISOString();
      const periodos=Array.isArray(atual.periodos)?atual.periodos.slice():[];
      if(atual.ativo===true){
        if(!periodos.length&&atual.inicio)periodos.push({inicio:atual.inicio,fim:agora});
        else if(periodos.length&&!periodos[periodos.length-1].fim)periodos[periodos.length-1]=Object.assign({},periodos[periodos.length-1],{fim:agora});
      }else if(novoAtivo){
        periodos.push({inicio:agora,fim:null});
      }
      const proximo={ativo:novoAtivo,inicio:atual.inicio||(novoAtivo?agora:null),periodos};
      try{await saveCfg({fidelidade:proximo});render()}
      catch(err){msg.textContent='Não foi possível salvar. Tente novamente.';btn.disabled=false;console.error(err)}
    };
  };
  render();
}
// ----- Configurações, entregadores e cupons -----
function config(tc){
  const D=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],i=(n,l,v,x)=>`<label>${l}<input name="${n}" value="${E(v)}" ${x||''}></label>`;
  tc.innerHTML=`<form class="f" id="cf"><h2 style="margin:0">Loja e entrega</h2>${i('nome','Nome do delivery',C.nome,'required')}${i('tempo','Tempo estimado (texto mostrado ao cliente)',C.tempo)}
  <div class="grid2">${i('abre','Abre às',C.abre,'type="time"')}${i('fecha','Fecha às',C.fecha,'type="time"')}</div>
  <div class="seg" style="flex-wrap:wrap">${D.map((d,k)=>`<label style="flex:0 0 auto"><input type="checkbox" name="d${k}" ${(C.dias||[]).indexOf(k)>=0?'checked':''}> ${d}</label>`).join('')}</div>
  <label>Funcionamento<select name="modo"><option value="auto" ${C.modo==='auto'?'selected':''}>Automático (pelo horário)</option><option value="aberto" ${C.modo==='aberto'?'selected':''}>Aberto agora (ignora horário)</option><option value="fechado" ${C.modo==='fechado'?'selected':''}>Fechado agora</option></select></label>
  <label style="flex-direction:row;display:flex;gap:8px;align-items:center"><input type="checkbox" name="retirada" ${C.retirada?'checked':''}> Aceitar retirada no balcão</label>
  ${i('minimo','Pedido mínimo padrão para entrega (R$). Cada região pode ter o seu.',C.minimo,'inputmode="decimal"')}
  ${i('wpp','WhatsApp da loja (55 + DDD + número, só números)',C.wpp,'inputmode="numeric"')}
  <h2 style="margin:0">Pix manual antigo (não utilizado com Mercado Pago)</h2>${i('pixChave','Chave Pix antiga',C.pixChave)}<div class="grid2">${i('pixNome','Nome do recebedor (até 25 letras)',C.pixNome)}${i('pixCidade','Cidade (até 15 letras)',C.pixCidade)}</div>
  <p id="sv" class="ok" role="status" style="margin:0"></p><button class="btn">Salvar configurações</button></form>
  <h2>Cidades atendidas (Distrito Federal)</h2><p class="note">Marque as cidades (regiões administrativas) onde você entrega e defina taxa, pedido mínimo e tempo de cada uma. Quem estiver em cidade não marcada não consegue pedir entrega; a retirada no balcão continua disponível.</p>
  <form class="f" id="cd"><div class="act"><button type="button" class="btn sm ghost" id="ca">Marcar todas</button><button type="button" class="btn sm ghost" id="cn">Desmarcar todas</button></div>
  <div class="row" style="font-size:12px;color:var(--mut)"><div class="g">Cidade</div><span style="width:84px">Taxa (R$)</span><span style="width:84px">Mínimo (R$)</span><span style="width:110px">Tempo</span></div><div id="cdl"></div><p id="cm" class="ok" role="status" style="margin:0"></p><button class="btn">Salvar cidades</button></form>
  <form class="cup" id="co2"><input name="n" required placeholder="Outra cidade (ex.: Valparaíso de Goiás)" aria-label="Outra cidade"><button class="btn sm alt">Adicionar cidade</button></form>
  <h2>Entregadores</h2><form class="cup" id="cf2"><input name="n" required placeholder="Nome do entregador" aria-label="Nome"><button class="btn sm alt">Adicionar</button></form><div id="cs"></div>
  <h2>Cupons de desconto</h2><form class="f" id="cf3"><div class="grid2"><label>Código<input name="c" required placeholder="BOCA10"></label><label>Tipo<select name="t"><option value="%">% de desconto</option><option value="R$">R$ de desconto</option></select></label><label>Valor<input name="v" required inputmode="decimal"></label><label>Pedido mínimo (R$)<input name="m" inputmode="decimal" value="0"></label></div><button class="btn sm alt">Criar cupom</button></form><div id="cu"></div>`;
  $('#cf').onsubmit=async e=>{e.preventDefault();const f=e.target.elements,n=s=>parseFloat(String(s).replace(',','.'))||0;
    await saveCfg({nome:f.nome.value.trim()||DEF.nome,tempo:f.tempo.value.trim(),abre:f.abre.value||'18:00',fecha:f.fecha.value||'23:00',dias:D.map((_,k)=>k).filter(k=>f['d'+k].checked),modo:f.modo.value,retirada:f.retirada.checked,minimo:n(f.minimo.value),wpp:f.wpp.value.replace(/\D/g,''),pixChave:f.pixChave.value.trim(),pixNome:f.pixNome.value.trim(),pixCidade:f.pixCidade.value.trim()});
    $('#sv').textContent='Configurações salvas.'};
  const rowsAtuais=()=>{const l=(C.cidades||[]).slice();DF.forEach(n=>{if(!l.some(r=>r.nome===n))l.push({nome:n,ativo:false,taxa:0,minimo:null,tempo:''})});
    return DF.map(n=>l.filter(r=>r.nome===n)[0]).concat(l.filter(r=>DF.indexOf(r.nome)<0))};
  const drawCd=rows=>{$('#cdl').innerHTML=rows.map(r=>`<div class="row" data-n="${E(r.nome)}"><label class="g" style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="at" ${r.ativo?'checked':''}> <b>${E(r.nome)}</b></label>
    <input type="number" name="taxa" step="0.01" min="0" value="${r.taxa||0}" aria-label="Taxa de ${E(r.nome)}"><input type="number" name="min" step="0.01" min="0" value="${r.minimo==null?'':r.minimo}" placeholder="padrão" aria-label="Pedido mínimo em ${E(r.nome)}"><input name="tempo" value="${E(r.tempo||'')}" placeholder="45 a 60 min" aria-label="Tempo em ${E(r.nome)}" style="width:110px;padding:6px;border:1.5px solid var(--line);border-radius:6px"></div>`).join('')};
  const lerCd=()=>$$('#cdl .row').map(el=>{const g=k=>el.querySelector('[name="'+k+'"]'),n=x=>parseFloat(String(x).replace(',','.'))||0;return{nome:el.dataset.n,ativo:g('at').checked,taxa:n(g('taxa').value),minimo:g('min').value.trim()===''?null:n(g('min').value),tempo:g('tempo').value.trim()}});
  drawCd(rowsAtuais());
  $('#ca').onclick=()=>$$('#cdl [name="at"]').forEach(x=>x.checked=true);$('#cn').onclick=()=>$$('#cdl [name="at"]').forEach(x=>x.checked=false);
  $('#cd').onsubmit=async e=>{e.preventDefault();await saveCfg({cidades:lerCd()});$('#cm').textContent='Cidades salvas.'};
  $('#co2').onsubmit=e=>{e.preventDefault();const n=e.target.elements.n.value.trim(),rows=lerCd();if(rows.some(r=>r.nome.toLowerCase()===n.toLowerCase())){alert('Essa cidade já está na lista.');return}rows.push({nome:n,ativo:true,taxa:0,minimo:null,tempo:''});drawCd(rows);e.target.reset();$('#cm').textContent='Cidade adicionada. Ajuste a taxa e clique em Salvar cidades.'};
  $('#cf2').onsubmit=async e=>{e.preventDefault();await S.put('couriers',{id:'c'+Date.now().toString(36),nome:e.target.elements.n.value.trim()});e.target.reset()};
  $('#cf3').onsubmit=async e=>{e.preventDefault();const f=e.target.elements,n=s=>parseFloat(String(s).replace(',','.'))||0;await S.put('cupons',{id:f.c.value.trim().toUpperCase(),tipo:f.t.value,valor:n(f.v.value),min:n(f.m.value),ativo:true});e.target.reset()};
  tc.onclick=async e=>{const a=e.target.closest('[data-dc]'),b=e.target.closest('[data-dq]'),c=e.target.closest('[data-tq]');
    if(a&&confirm('Remover entregador?'))await S.del('couriers',a.dataset.dc);
    if(b&&confirm('Remover cupom?'))await S.del('cupons',b.dataset.dq);
    if(c){const q=c.dataset.tq;const l=await S.get('cupons',q);await S.put('cupons',Object.assign({},l,{ativo:!l.ativo}))}};
  unsubs.push(S.col('couriers',l=>{$('#cs').innerHTML=l.map(c=>`<div class="row"><div class="g">${E(c.nome)}</div><button class="btn sm ghost" data-dc="${E(c.id)}">Remover</button></div>`).join('')||'<p class="note">Nenhum entregador cadastrado.</p>'}));
  unsubs.push(S.col('cupons',l=>{$('#cu').innerHTML=l.map(c=>`<div class="row"><div class="g"><b>${E(c.id)}</b> · ${c.tipo==='%'?E(c.valor)+'%':R(c.valor)} · mín. ${R(c.min||0)} ${c.ativo?'':'<span class="tag wait">INATIVO</span>'}</div><button class="btn sm ghost" data-tq="${E(c.id)}">${c.ativo?'Desativar':'Ativar'}</button><button class="btn sm ghost" data-dq="${E(c.id)}">Remover</button></div>`).join('')||'<p class="note">Nenhum cupom.</p>'}));
}

// ================= AUDITORIA =================
const AL={pedido_criado:'Pedido criado',status_alterado:'Status alterado',pedido_cancelado:'Pedido cancelado',pagamento_confirmado:'Pagamento confirmado',pagamento_desfeito:'Pagamento desfeito',entregador_atribuido:'Entregador atribuído'};
function auditoria(){
  app.innerHTML=`<section class="hero"><h1>Auditoria</h1><p>Logado como ${E(actor)}. <a href="#" id="out">Sair</a></p><p>Cada ação gera um registro com data, autor e um código (hash SHA-256) ligado ao registro anterior do mesmo pedido. Se alguém alterar ou apagar algo, a verificação aponta.</p></section>
  <p><button class="btn" id="vf">Verificar integridade</button> <button class="btn ghost" id="ex">Exportar CSV</button></p><div id="rs"></div><div class="wrap"><table class="tbl"><thead><tr><th>Data/hora</th><th>Pedido</th><th>Ação</th><th>Detalhe</th><th>Autor</th><th>Hash</th></tr></thead><tbody id="tb"></tbody></table></div>`;
  $('#out').onclick=e=>{e.preventDefault();delete SS.boca2_actor;actor=null;route()};
  watchOrders();let A=[],O=[];
  const det=a=>a.action==='entregador_atribuido'?E(a.d):(a.action==='status_alterado'||a.action==='pedido_cancelado'||a.action==='pedido_criado')?E(LBL[a.from]||'—')+' → '+E(LBL[a.to]||'—'):'pedido: '+E(LBL[a.to]||'—');
  const draw=()=>{$('#tb').innerHTML=A.slice().sort((a,b)=>b.ts.localeCompare(a.ts)).map(a=>`<tr><td>${new Date(a.ts).toLocaleString('pt-BR')}</td><td>${E(a.orderId)}</td><td>${E(AL[a.action]||a.action)}</td><td>${det(a)}</td><td>${E(a.actor)}</td><td><code>${String(a.hash||'—').slice(0,16)}${a.hash?'…':''}</code></td></tr>`).join('')};
  unsubs.push(S.col('audit',l=>{A=l;draw()}));unsubs.push(S.col('orders',l=>{O=l}));
  $('#vf').onclick=async()=>{const errs=[],ids=[],add=x=>{if(ids.indexOf(x)<0)ids.push(x)};A.forEach(a=>add(a.orderId));O.forEach(o=>add(o.id));
    for(let z=0;z<ids.length;z++){const id=ids[z],ch=A.filter(a=>a.orderId===id&&a.hash&&Number.isInteger(a.n)).sort((a,b)=>a.n-b.n),o=O.filter(x=>x.id===id)[0];
      if(!ch.length){errs.push(id+': pedido sem nenhum registro de auditoria');continue}
      let prev='0';for(let k=0;k<ch.length;k++){const a=ch[k];
        if(a.n!==k){errs.push(id+': registro '+k+' ausente na sequência');break}
        if(a.prev!==prev){errs.push(id+': registro '+k+' não encaixa no anterior');break}
        if(await sha(canon(a))!==a.hash){errs.push(id+': registro '+k+' foi alterado');break}prev=a.hash}
      if(o&&ch[0].action==='pedido_criado'&&ch[0].d!==await snap(o))errs.push(id+': dados do pedido (itens, valores ou cliente) foram alterados depois de criado');
      if(o&&(o.lastHash!==prev||o.status!==ch[ch.length-1].to))errs.push(id+': status atual não confere com o histórico')}
    $('#rs').innerHTML=errs.length?`<p class="bad" role="alert">${errs.length} problema(s) encontrado(s):</p><ul>${errs.map(x=>`<li class="bad">${E(x)}</li>`).join('')}</ul>`:`<p class="ok">Íntegro: ${A.filter(a=>a.hash&&Number.isInteger(a.n)).length} registros encadeados de ${ids.length} pedidos, sem alterações detectadas. Confirmações do Mercado Pago permanecem no histórico, mas são verificadas separadamente.</p>`};
  $('#ex').onclick=()=>{const q=v=>'"'+String(v).replace(/"/g,'""')+'"';const csv=['ts,pedido,n,acao,de,para,detalhe,autor,hash_anterior,hash'].concat(A.slice().sort((a,b)=>a.ts.localeCompare(b.ts)).map(a=>[a.ts,a.orderId,a.n,a.action,a.from,a.to,a.d,a.actor,a.prev,a.hash].map(q).join(','))).join('\n');
    const u=URL.createObjectURL(new Blob([csv],{type:'text/csv'})),l=document.createElement('a');l.href=u;l.download='auditoria.csv';l.click();URL.revokeObjectURL(u)};
}
brand();route();
})();
